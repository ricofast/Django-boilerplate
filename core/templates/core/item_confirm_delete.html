{% extends 'base.html' %}

{% block title %}Delete item{% endblock %}

{% block content %}
<h1 class="h3">Delete {{ object.name }}?</h1>
<p>This action cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Confirm delete</button>
  <a class="btn btn-outline-secondary" href="{% url 'core:item-detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
