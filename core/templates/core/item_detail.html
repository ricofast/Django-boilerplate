{% extends 'base.html' %}

{% block title %}{{ object.name }}{% endblock %}

{% block content %}
<h1 class="h3">{{ object.name }}</h1>
<p>{{ object.description|linebreaks }}</p>
<p><strong>Owner:</strong> {{ object.owner.email }}</p>
<div class="d-flex gap-2">
  <a class="btn btn-secondary" href="{% url 'core:item-update' object.pk %}">Edit</a>
  <a class="btn btn-danger" href="{% url 'core:item-delete' object.pk %}">Delete</a>
  <a class="btn btn-outline-secondary" href="{% url 'core:item-list' %}">Back</a>
</div>
{% endblock %}
