<h1>Items</h1>
<a href="{% url 'core:item-create' %}">Create item</a> | <a href="{% url 'logout' %}">Logout</a>
<ul>
  {% for item in object_list %}
    <li>
      <a href="{% url 'core:item-detail' item.pk %}">{{ item.name }}</a> by {{ item.owner.username }}
    </li>
  {% empty %}
    <li>No items yet.</li>
  {% endfor %}
</ul>
