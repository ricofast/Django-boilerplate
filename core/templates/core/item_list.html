{% extends 'base.html' %}

{% block title %}Items{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">Items</h1>
  <a class="btn btn-primary" href="{% url 'core:item-create' %}">Create item</a>
</div>

<div class="list-group">
  {% for item in object_list %}
    <a class="list-group-item list-group-item-action" href="{% url 'core:item-detail' item.pk %}">
      <strong>{{ item.name }}</strong>
    </a>
  {% empty %}
    <div class="list-group-item">No items yet.</div>
  {% endfor %}
</div>
{% endblock %}
