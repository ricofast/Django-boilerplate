<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django Boilerplate{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'core:item-list' %}">Boilerplate</a>
    <div class="collapse navbar-collapse show">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'core:item-list' %}">Items</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'profiles:profile-detail' %}">Profile</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item me-2 navbar-text">{{ user.email }}</li>
          <li class="nav-item"><a class="btn btn-outline-secondary btn-sm" href="{% url 'logout' %}">Logout</a></li>
        {% else %}
          <li class="nav-item me-2"><a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="btn btn-primary btn-sm" href="{% url 'account_signup' %}">Sign up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
